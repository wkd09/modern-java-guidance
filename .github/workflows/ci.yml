name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run A/B evaluation suite
        run: python scripts/eval_suite.py
      - name: Run benchmark sanity check
        run: python scripts/benchmark.py

  semgrep-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and Semgrep
        run: |
          pip install -e .
          pip install semgrep
      - name: Verify exported Semgrep YAML matches committed ruleset
        run: |
          mjg export --format semgrep --java 21 --boot 3.4.0 -o /tmp/exported.yaml
          diff -u rules/semgrep/modern-java-boot3.yaml /tmp/exported.yaml
      - name: Verify bundled skill matches skills/modern-java-guidance
        run: diff -ru skills/modern-java-guidance src/modern_java_guidance/bundled_skill
      - name: Validate and unit-test Semgrep rules
        run: |
          semgrep --validate --config rules/semgrep/modern-java-boot3.yaml
          semgrep --test rules/semgrep/
